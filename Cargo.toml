[package]
name = "liquidation-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
publish = false

[[bin]]
name = "liquidation-engine"
path = "src/main.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[dependencies]
alloy = { version = "2.5", features = ["full"] }
anyhow = "1"
bigdecimal = { version = "0.4", features = ["serde-json"] }
dotenvy = "0.15"
futures-util = "0.3"
redis = { version = "0.32", features = ["tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros", "bigdecimal", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

